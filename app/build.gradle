plugins { id 'com.android.application' }

def releaseKeystorePath = System.getenv('DOXA_KEYSTORE_PATH')

android {
    namespace 'com.doxa.android'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.doxa.android'
        minSdk 23

        // Android 15 / API 35: remove o aviso de aplicativo destinado a Android antigo.
        targetSdk 35

        versionCode (1000 + Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1'))
        versionName '40'

        buildConfigField 'String', 'DOXA_SUPABASE_URL', '"https://fxruwzaaiecqsxkuxmsp.supabase.co"'
        buildConfigField 'String', 'DOXA_SUPABASE_PUBLISHABLE_KEY', '"sb_publishable_aDmA8htcNCaC0IfGLpT5Hg_lx7IOceG"'
    }

    signingConfigs {
        debug {
            // PUBLIC TEST KEY. Never use this identity for production.
            storeFile rootProject.file('config/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('DOXA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DOXA_KEY_ALIAS')
                keyPassword System.getenv('DOXA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-test'
            resValue 'string', 'app_name', 'Doxa Teste'
        }

        release {
            resValue 'string', 'app_name', 'Doxa'

            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }

            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
