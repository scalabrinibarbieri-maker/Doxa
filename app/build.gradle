plugins { id 'com.android.application' }

android {
    namespace 'com.doxa.android'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.doxa.android'
        minSdk 23
        // Preserve V29 behavior; raising targetSdk requires a separate device test cycle.
        targetSdk 29
        versionCode (1000 + Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1'))
        versionName '30.0-foundation'
    }
    signingConfigs {
        debug {
            // PUBLIC TEST KEY. Never use this identity for production.
            storeFile rootProject.file('config/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-test'
            resValue 'string', 'app_name', 'Doxa Teste'
        }
        release {
            resValue 'string', 'app_name', 'Doxa'
            // No fallback signing. Production key must be configured separately.
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        // Compatibilidade temporaria com V29, somente no teste local.
        if (project.findProperty('doxaLocalTest') == 'true') {
            warning 'ExpiredTargetSdkVersion'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
}
