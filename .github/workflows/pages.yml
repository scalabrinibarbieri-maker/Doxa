name: Página oficial

# Publica a pasta site/ no GitHub Pages.
# Uma vez, em Settings → Pages, escolha Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # A página é um arquivo único na raiz (index.html), com as imagens embutidas.
      - name: Separar a página
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
