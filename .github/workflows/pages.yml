name: Página oficial

# Publica a página oficial (index.html) e as páginas da Conta Doxa (conta/) no GitHub Pages.
# Uma vez, em Settings → Pages, escolha Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['index.html', 'conta/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # A página oficial é um arquivo único na raiz (index.html), com as imagens embutidas.
      # A pasta conta/ tem as páginas da Conta Doxa: confirmação de e-mail, nova senha,
      # excluir conta e política de privacidade (os links dos e-mails apontam para elas).
      - name: Separar as páginas
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d conta ]; then cp -r conta _site/conta; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
